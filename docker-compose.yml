services:
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: logistics-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - logistics-network

  otel-collector:
    image: otel/opentelemetry-collector:0.91.0
    container_name: OTEL
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4316:4317"    # OTLP gRPC receiver
      - "4319:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus exporter
    depends_on:
      - jaeger
    networks:
      - logistics-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: logistics-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - logistics-network