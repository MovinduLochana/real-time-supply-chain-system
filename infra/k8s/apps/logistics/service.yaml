apiVersion: v1
kind: Service
metadata:
  name: logistics-service
  namespace: rtscs-services
  labels:
    app: logistics-service
spec:
  type: ClusterIP
  selector:
    app: logistics-service
  ports:
  - name: http
    port: 80
    targetPort: 3001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
