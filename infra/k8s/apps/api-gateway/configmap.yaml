apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: rtscs-services
data:
  log_level: "INFO"
  enable_debug: "false"
  enable_cors: "true"
  cors_origins: "http://localhost:3000,http://localhost:3001"
  request_timeout_ms: "30000"
  enable_tracing: "true"
  tracing_sample_rate: "1.0"
