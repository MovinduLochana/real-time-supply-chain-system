apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: rtscs-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      serviceAccountName: order-service
      containers:
      - name: order-service
        image: placeholder/order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: POSTGRES_HOST
          value: postgres.rtscs-data.svc.cluster.local
        - name: POSTGRES_DB
          value: rtscs_order
        - name: KAFKA_BROKERS
          value: kafka-bootstrap.rtscs-data.svc.cluster.local:9092
        - name: INVENTORY_SERVICE_HOST
          value: inventory-service.rtscs-services.svc.cluster.local:50051
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
