
spring:
  application:
    name: auth-service

  data:
    redis:
      host: redis-12697.c212.ap-south-1-1.ec2.cloud.redislabs.com
      port: 12697
      username: default
      password: WyQRlGWS2Dv8sHFK7vzZuxmSmrqhvJxI
#      ssl: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${keycloak.realm}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${keycloak.realm}/protocol/openid-connect/certs

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:logistics}
  client-id: ${KEYCLOAK_CLIENT_ID:logistics-id}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:logistics-api-secret}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:movindu}
    password: ${KEYCLOAK_ADMIN_PASSWORD:movindu@123}
    client-id: admin-cli

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
        application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info
    movindu.authservice: debug
    org.keycloak: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

server:
  port: 8081

