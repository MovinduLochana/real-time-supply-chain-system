syntax = "proto3";

package rtscs.logistics.v1;

option go_package = "github.com/rtscs/proto-go/gen/go/rtscs/logistics/v1;logisticsv1";
option java_package = "com.rtscs.proto.logistics.v1";
option java_multiple_files = true;

import "rtscs/logistics/v1/location.proto";

service LogisticsService {
  // CreateShipment creates a new shipment for an order
  rpc CreateShipment (CreateShipmentRequest) returns (Shipment);
  
  // GetShipment retrieves shipment details
  rpc GetShipment (GetShipmentRequest) returns (Shipment);
  
  // UpdateLocation updates GPS position (called frequently by IoT devices)
  rpc UpdateLocation (UpdateLocationRequest) returns (UpdateLocationResponse);
  
  // StreamLocation provides real-time location stream (server-streaming)
  rpc StreamLocation (StreamLocationRequest) returns (stream Location);
  
  // GetTrackingHistory returns historical tracking events
  rpc GetTrackingHistory (GetTrackingHistoryRequest) returns (GetTrackingHistoryResponse);
}

message CreateShipmentRequest {
  string order_id = 1;
  string carrier = 2;
  string destination_address = 3;
  repeated ShipmentItem items = 4;
  
  message ShipmentItem {
    string sku = 1;
    int32 quantity = 2;
  }
}

message GetShipmentRequest {
  string shipment_id = 1;
}

message UpdateLocationRequest {
  string shipment_id = 1;
  double latitude = 2;
  double longitude = 3;
  double accuracy_meters = 4;
}

message UpdateLocationResponse {
  bool success = 1;
  Shipment shipment = 2;
}

message StreamLocationRequest {
  string shipment_id = 1;
}

message GetTrackingHistoryRequest {
  string shipment_id = 1;
  int32 limit = 2;  // Max number of events to return
}

message GetTrackingHistoryResponse {
  repeated TrackingEvent events = 1;
}
