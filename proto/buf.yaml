version: v1
lint:
  use:
    - DEFAULT
    - COMMENTS
  except:
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
    - COMMENT_SERVICE
breaking:
  use:
    - FILE
    - ENUM_NO_DELETE
    - ENUM_VALUE_NO_DELETE
    - MESSAGE_NO_DELETE
    - MESSAGE_NO_DELETE_BY_REGEXP
    - MESSAGE_NO_REMOVE_STANDARD_DESCRIPTOR_ACCESSOR
    - MESSAGE_NO_REMOVE_CUSTOM_DESCRIPTOR_ACCESSOR
    - RPC_NO_DELETE
    - RPC_NO_DELETE_BY_REGEXP
    - SERVICE_NO_DELETE
    - SERVICE_NO_DELETE_BY_REGEXP
    - MESSAGE_FIELD_NO_DELETE
    - MESSAGE_FIELD_NO_DELETE_BY_REGEXP
    - ENUM_VALUE_NO_DELETE_BY_REGEXP
